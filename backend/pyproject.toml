[project]
name = "stylesphere-nexus-api"
version = "0.1.0"
description = "StyleSphere Nexus - vendor onboarding & compliance orchestration API"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "supabase>=2.10.0",
    "httpx>=0.27.0",
    "python-json-logger>=2.0.7",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "google-genai>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Spec §3 layout: only main.py lives under app/; api, core, repositories,
# services, events, workers, schemas, models, settings and utils are siblings.
[tool.setuptools]
packages = [
    "app",
    "api",
    "api.v1",
    "core",
    "repositories",
    "services",
    "services.ai",
    "services.notification",
    "services.storage",
    "services.analytics",
    "events",
    "workers",
    "schemas",
    "models",
    "settings",
    "utils",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Add `asyncio_mode = "auto"` here once pytest-asyncio is installed and the
# first async test lands. Declaring it earlier only emits an unknown-option
# warning on every run.
